$kind: http-request
description: ""
url: "{{baseUrl}}/users/me"
method: PATCH
headers:
  - key: X-Correlation-ID
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "string",
      "phoneNumber": null
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "fullName": {
          "type": "string",
          "minLength": 2,
          "maxLength": 255
        },
        "phoneNumber": {
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": []
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/updateProfile.resources/examples
order: 2000
