$kind: http-request
description: ""
url: "{{baseUrl}}/learning/admin/vocabularies"
method: POST
headers:
  - key: X-Correlation-ID
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      }
  - key: Idempotency-Key
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: "{}"
  $type: |-
    {
      "type": "object",
      "properties": {
        "topicId": {
          "type": "string",
          "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        },
        "word": {
          "type": "string",
          "minLength": 1,
          "maxLength": 255
        },
        "phonetic": {
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        },
        "definition": {
          "type": "string",
          "minLength": 1,
          "maxLength": 10000
        },
        "example": {
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "topicId",
        "word",
        "definition"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/createVocabulary.resources/examples
order: 2000
