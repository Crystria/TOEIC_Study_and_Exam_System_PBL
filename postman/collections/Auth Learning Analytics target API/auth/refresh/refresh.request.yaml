$kind: http-request
description: ""
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  - key: X-Correlation-ID
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
settings: {}
examples: ./.resources/refresh.resources/examples
order: 1000
