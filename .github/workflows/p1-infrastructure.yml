name: P1 infrastructure
on:
  pull_request:
    paths: ['packages/**', 'services/**', '.github/workflows/p1-infrastructure.yml']
  push:
    branches: [BE, main, develop]
    paths: ['packages/**', 'services/**', '.github/workflows/p1-infrastructure.yml']
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toeic
          POSTGRES_PASSWORD: toeic
        options: --health-cmd "pg_isready -U toeic" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: toeic
          RABBITMQ_DEFAULT_PASS: toeic
        ports: ['5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @toeic/common
      - run: npm run test:p1 -w @toeic/common
      - run: npm run validate:p0 -w @toeic/contracts
      - name: PostgreSQL lease verification in disposable DB
        working-directory: packages/common
        env:
          P1_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node test/postgres-outbox.cjs
      - name: RabbitMQ retry DLQ and reconnect in isolated exchange
        working-directory: packages/common
        env:
          P1_RABBITMQ_URL: amqp://toeic:toeic@localhost:5672
        run: node test/rabbitmq.cjs
