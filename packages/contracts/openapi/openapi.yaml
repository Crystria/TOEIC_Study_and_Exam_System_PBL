openapi: 3.0.3
info:
  title: TOEIC Study & Exam System API
  version: 0.2.0
  description: >
    Spec REST tổng hợp cho các endpoint đi qua API Gateway.
    Contract P4 cho QuestionGroup, Dynamic Part Test, Attempt snapshot và readiness.
servers:
  - url: https://api.example.com
    description: Production (qua API Gateway)
  - url: http://localhost:3000
    description: Local (API Gateway)
tags:
  - name: health
  - name: auth
  - name: users
  - name: questions
  - name: question-groups
  - name: tests
  - name: attempts
  - name: learning
  - name: analytics
  - name: ai
paths:
  /health:
    get:
      tags: [health]
      summary: Gateway liveness (không yêu cầu JWT)
      responses:
        '200':
          description: Gateway đang chạy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
  /status:
    get:
      tags: [health]
      summary: Gateway status (không yêu cầu JWT hoặc rate limit)
      responses:
        '200': { description: Gateway đang chạy }
  /ready:
    get:
      tags: [health]
      summary: Gateway và các dependency bắt buộc sẵn sàng
      description: >
        Không yêu cầu JWT hoặc rate limit. Probe Redis và HTTP Auth, Question Bank,
        Exam, Analytics; mọi upstream probe PostgreSQL, Auth/Exam probe cả Redis.
        Mỗi probe có timeout; không trả connection string hoặc lỗi nội bộ.
      responses:
        '200':
          description: Sẵn sàng nhận request
          content:
            application/json:
              schema:
                type: object
                required: [status, checks, qa]
                properties:
                  status: { type: string, enum: [ready] }
                  checks:
                    {
                      type: object,
                      additionalProperties: { type: string, enum: [ok, unavailable] },
                    }
                  qa: { type: boolean, description: Chỉ true khi QA_MODE=true }
        '503': { description: Có dependency bắt buộc chưa sẵn sàng }
  /api/v1/questions:
    get:
      tags: [questions]
      summary: Tìm câu hỏi active; USER không nhận answer key
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: part, in: query, schema: { type: integer, minimum: 1, maximum: 7 } }
        - { name: difficulty, in: query, schema: { type: string, enum: [EASY, MEDIUM, HARD] } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: groupId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Trang câu hỏi
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Question' } }
                  total: { type: integer }
                  page: { type: integer }
                  size: { type: integer }
                  totalPages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [questions]
      summary: Tạo câu hỏi (CONTENT_ADMIN/SYSTEM_ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuestionRequest' }
      responses:
        '201':
          description: Câu hỏi được tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/questions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [questions]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Chi tiết câu hỏi active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [questions]
      summary: Cập nhật câu hỏi (CONTENT_ADMIN/SYSTEM_ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQuestionRequest' }
      responses:
        '200':
          description: Câu hỏi được cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [questions]
      summary: Archive câu hỏi (CONTENT_ADMIN/SYSTEM_ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Archived }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/questions/reindex:
    post:
      tags: [questions]
      summary: Rebuild search index (SYSTEM_ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Số document đã index }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/questions/{id}/media/presign:
    post:
      tags: [questions]
      summary: Presign upload audio/image cho câu hỏi
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/question-groups:
    get:
      tags: [question-groups]
      summary: Danh sách QuestionGroup
      security:
        - bearerAuth: []
      parameters:
        - name: part
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 7
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Danh sách group
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuestionGroup'
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [question-groups]
      summary: Tạo QuestionGroup (CONTENT_ADMIN/SYSTEM_ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionGroupRequest'
      responses:
        '201':
          description: Đã tạo group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/question-groups/{id}:
    get:
      tags: [question-groups]
      summary: Chi tiết QuestionGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chi tiết group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [question-groups]
      summary: Cập nhật QuestionGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionGroupRequest'
      responses:
        '200':
          description: Group đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [question-groups]
      summary: Archive group và toàn bộ câu con
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Đã archive
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/question-groups/{id}/media/presign:
    post:
      tags: [question-groups]
      summary: Presign upload audio/image/passage asset cho group
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tests:
    get:
      tags: [tests]
      summary: Danh sách đề active
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách đề
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Test'
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tests]
      summary: Tạo đề hoàn chỉnh 7 Part
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestRequest'
      responses:
        '201':
          description: Đã tạo đề
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tests/{testId}:
    patch:
      tags: [tests]
      summary: Cập nhật đề; attempt cũ giữ nguyên snapshot (CONTENT_ADMIN/SYSTEM_ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1 }
                durationSeconds: { type: integer, enum: [7200] }
                questions:
                  {
                    type: array,
                    minItems: 200,
                    maxItems: 200,
                    items: { $ref: '#/components/schemas/TestQuestionInput' },
                  }
      responses:
        '200':
          description: Đề đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tests]
      summary: Archive đề; không ảnh hưởng attempt cũ
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200': { description: Đề đã archive }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [tests]
      summary: Chi tiết đề
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: Chi tiết đề
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tests/{testId}/parts:
    get:
      tags: [tests]
      summary: Danh sách 7 Part và số câu/group khả dụng
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: Thông tin Part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPartsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tests/{testId}/attempts:
    post:
      tags: [attempts]
      summary: Bắt đầu Full Test
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Attempt Full đã bắt đầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/tests/{testId}/part-attempts:
    post:
      tags: [attempts]
      summary: Bắt đầu Dynamic Part Test
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TestId'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPartAttemptRequest'
      responses:
        '201':
          description: Attempt Part đã bắt đầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Group/Part không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/v1/attempts/{id}:
    get:
      tags: [attempts]
      summary: Kết quả hoặc trạng thái attempt
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Kết quả attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/attempts/{id}/draft:
    put:
      tags: [attempts]
      summary: Merge draft Redis, TTL đến deadline + 1 giờ
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  {
                    type: array,
                    maxItems: 200,
                    items: { $ref: '#/components/schemas/AnswerInput' },
                  }
      responses:
        '200': { description: Đã lưu draft; chưa ghi attempt_answers }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Redis không khả dụng; client giữ local answers và thử lại }
  /api/v1/attempts:
    get:
      tags: [attempts]
      summary: Lịch sử attempt của user
      security:
        - bearerAuth: []
      parameters:
        - name: mode
          in: query
          schema:
            $ref: '#/components/schemas/AttemptMode'
        - name: testId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Lịch sử attempt
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attempt'
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/attempts/{id}/answers/{questionId}:
    put:
      tags: [attempts]
      summary: Lưu đáp án trong lúc làm
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
      responses:
        '200':
          description: Đã lưu đáp án (không trả isCorrect)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/attempts/{id}/submit:
    post:
      tags: [attempts]
      summary: Nộp bài (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAttemptRequest'
      responses:
        '201':
          description: Kết quả sau khi nộp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestId:
      name: testId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc sai access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột trạng thái
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [statusCode, code, message, correlationId, timestamp, path]
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: { type: string }
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            details:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                      part:
                        type: integer
                      groupId:
                        type: string
                        format: uuid
                      questionId:
                        type: string
                        format: uuid
                      message:
                        type: string
    QuestionOption:
      type: object
      required: [optionCode, optionText]
      properties:
        optionCode:
          type: string
          enum: [A, B, C, D]
        optionText:
          type: string
    CreateQuestionRequest:
      type: object
      required: [part, type, difficulty, correctOption, options]
      properties:
        part: { type: integer, minimum: 1, maximum: 7 }
        type: { type: string, minLength: 1 }
        questionText: { type: string, nullable: true }
        explanation: { type: string, nullable: true }
        difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
        correctOption: { type: string, enum: [A, B, C, D] }
        groupId: { type: string, format: uuid, nullable: true }
        positionInGroup: { type: integer, minimum: 1, nullable: true }
        transcript: { type: string, nullable: true }
        audioKey: { type: string, nullable: true }
        imageKey: { type: string, nullable: true }
        tags: { type: array, maxItems: 30, uniqueItems: true, items: { type: string } }
        options:
          type: array
          minItems: 3
          maxItems: 4
          items: { $ref: '#/components/schemas/QuestionOption' }
    UpdateQuestionRequest:
      type: object
      description: Các field của CreateQuestionRequest đều optional; validate trên dữ liệu sau merge.
      properties:
        part: { type: integer, minimum: 1, maximum: 7 }
        type: { type: string, minLength: 1 }
        questionText: { type: string, nullable: true }
        explanation: { type: string, nullable: true }
        difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
        correctOption: { type: string, enum: [A, B, C, D] }
        groupId: { type: string, format: uuid, nullable: true }
        positionInGroup: { type: integer, minimum: 1, nullable: true }
        transcript: { type: string, nullable: true }
        audioKey: { type: string, nullable: true }
        imageKey: { type: string, nullable: true }
