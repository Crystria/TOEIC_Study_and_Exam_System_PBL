syntax = "proto3";

package toeic.questionbank.v1;

// Dịch vụ nội bộ: Exam Service gọi Question Bank để lấy nội dung câu hỏi và answer key.
service QuestionBankService {
  // Lấy danh sách câu hỏi theo id (dùng khi tải cấu trúc đề).
  rpc GetQuestions(GetQuestionsRequest) returns (GetQuestionsResponse);
  // Lấy answer key để chấm điểm (chỉ dùng nội bộ, không lộ ra client).
  rpc GetAnswerKey(GetAnswerKeyRequest) returns (GetAnswerKeyResponse);
}

message GetQuestionsRequest {
  repeated string question_ids = 1;
}

message QuestionOption {
  string id = 1;
  string option_key = 2;
  string content = 3;
  string media_url = 4;
}

message Question {
  string id = 1;
  int32 part = 2;
  string type = 3;
  string stem = 4;
  string explanation = 5;
  string difficulty = 6;
  string media_url = 7;
  repeated QuestionOption options = 8;
  string group_id = 9;
  int32 position_in_group = 10;
  string transcript = 11;
  string audio_key = 12;
  string image_key = 13;
  bool is_complete = 14;
  string question_text = 15;
}

message QuestionGroupAsset {
  string asset_id = 1;
  string kind = 2;
  string storage_key = 3;
  string content = 4;
  int32 order_no = 5;
}

message QuestionGroup {
  string group_id = 1;
  int32 part = 2;
  string type = 3;
  string instruction = 4;
  string audio_key = 5;
  string transcript = 6;
  string passage_text = 7;
  int32 order_no = 8;
  repeated QuestionGroupAsset assets = 9;
  repeated string question_ids = 10;
}

message GetQuestionsResponse {
  repeated Question questions = 1;
  repeated QuestionGroup groups = 2;
  repeated string missing_ids = 3;
}

message GetAnswerKeyRequest {
  repeated string question_ids = 1;
}

message AnswerKeyItem {
  string question_id = 1;
  string correct_option = 2;
}

message GetAnswerKeyResponse {
  repeated AnswerKeyItem answers = 1;
  repeated string missing_ids = 2;
}
