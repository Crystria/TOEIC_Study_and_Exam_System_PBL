name: toeic-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: toeic-postgres
    restart: unless-stopped
    cpus: ${POSTGRES_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toeic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toeic}
      POSTGRES_DB: postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-toeic}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: toeic-redis
    restart: unless-stopped
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-7379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: toeic-rabbitmq
    restart: unless-stopped
    cpus: ${RABBITMQ_CPUS:-0.5}
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-512m}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-toeic}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-toeic}
    ports:
      - '${RABBITMQ_PORT:-5772}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    container_name: toeic-minio
    restart: unless-stopped
    cpus: ${MINIO_CPUS:-1.0}
    mem_limit: ${MINIO_MEMORY_LIMIT:-768m}
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-19000}:9000'
      - '${MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: toeic-elasticsearch
    restart: unless-stopped
    cpus: ${ELASTICSEARCH_CPUS:-2.0}
    mem_limit: ${ELASTICSEARCH_MEMORY_LIMIT:-1536m}
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '${ELASTICSEARCH_PORT:-19200}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: toeic-mailhog
    restart: unless-stopped
    cpus: ${MAILHOG_CPUS:-0.25}
    mem_limit: ${MAILHOG_MEMORY_LIMIT:-256m}
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  elasticsearch-data: