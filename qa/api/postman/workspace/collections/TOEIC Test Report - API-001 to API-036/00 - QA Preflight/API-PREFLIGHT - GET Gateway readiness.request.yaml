$kind: http-request
description: Read-only QA environment guard.
url: "{{gatewayOrigin}}/ready"
method: GET
headers:
  X-Correlation-ID: "{{$guid}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("qaReadyConfirmed", "false");
      pm.collectionVariables.set("accessTokenA","");
      pm.collectionVariables.set("accessTokenB","");
      pm.collectionVariables.set("refreshTokenA","");
      pm.collectionVariables.set("refreshTokenB","");
    language: text/javascript
  - type: afterResponse
    code: |-
      
      function bodyJson() {
        try { return pm.response.json(); } catch (_) { return {}; }
      }
      function findValue(obj, keys) {
        if (!obj || typeof obj !== "object") return undefined;
        if (Array.isArray(obj)) {
          for (const item of obj) { const v = findValue(item, keys); if (v !== undefined) return v; }
          return undefined;
        }
        for (const [k, v] of Object.entries(obj)) {
          if (keys.includes(k) && v !== undefined && v !== null) return v;
        }
        for (const v of Object.values(obj)) {
          const found = findValue(v, keys);
          if (found !== undefined) return found;
        }
        return undefined;
      }
      function allObjects(obj, out = []) {
        if (!obj || typeof obj !== "object") return out;
        if (Array.isArray(obj)) obj.forEach(x => allObjects(x, out));
        else { out.push(obj); Object.values(obj).forEach(x => allObjects(x, out)); }
        return out;
      }
      function questionIds(obj) {
        const ids = new Set();
        for (const o of allObjects(obj)) {
          const id = o.questionId || o.id;
          if (typeof o.questionId === "string" && /^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(o.questionId)) ids.add(o.questionId);
        }
        return [...ids];
      }
      function assertNoKeys(obj, blocked) {
        const seen = [];
        for (const o of allObjects(obj)) {
          for (const k of Object.keys(o)) if (blocked.includes(k.toLowerCase())) seen.push(k);
        }
        pm.expect(seen, "Sensitive answer fields must not be exposed before submit").to.eql([]);
      }
      function saveToken(body, prefix) {
        const access = findValue(body, ["accessToken", "access_token"]);
        const refresh = findValue(body, ["refreshToken", "refresh_token"]);
        const userId = findValue(body, ["userId", "id"]);
        if (access) pm.collectionVariables.set("accessToken" + prefix, access);
        if (refresh) pm.collectionVariables.set("refreshToken" + prefix, refresh);
        if (userId) pm.collectionVariables.set("user" + prefix + "Id", userId);
      }
      function saveAttempt(body) {
        const id = findValue(body, ["attemptId"]);
        if (id) pm.collectionVariables.set("attemptId", id);
        const ids = questionIds(body);
        if (ids.length) {
          pm.collectionVariables.set("questionIdsJson", JSON.stringify(ids));
          pm.collectionVariables.set("firstQuestionId", ids[0]);
          if (ids[1]) pm.collectionVariables.set("secondQuestionId", ids[1]);
          if (ids[2]) pm.collectionVariables.set("thirdQuestionId", ids[2]);
        }
        for (const o of allObjects(body)) {
          const part = Number(o.part || o.partNumber || o.sectionPart);
          const qid = o.questionId;
          if (part === 2 && typeof qid === "string") { pm.collectionVariables.set("part2QuestionId", qid); break; }
        }
      }
      function expectStatus(code) { pm.test("HTTP " + code, () => pm.response.to.have.status(code)); }
      function assertJson() { pm.test("Response is valid JSON", () => pm.expect(bodyJson()).to.be.an("object")); }
      function getAnswers(body) {
        const arr = findValue(body, ["answers", "draftAnswers"]);
        return Array.isArray(arr) ? arr : [];
      }
      function answerFor(body, qid) {
        return getAnswers(body).find(x => x.questionId === qid);
      }
      function authHeader(prefix = "A") { return "Bearer " + (pm.collectionVariables.get("accessToken" + prefix) || ""); }
      function makeIdempotencyKey() {
        const key = pm.variables.replaceIn("{{$guid}}");
        pm.collectionVariables.set("lastIdempotencyKey", key);
        return key;
      }


      const d = bodyJson();
      const origin = (pm.collectionVariables.get("gatewayOrigin") || "").replace(/\/+$/, "");
      const base = (pm.collectionVariables.get("baseUrl") || "").replace(/\/+$/, "");
      const local = /^https?:\/\/(localhost|127\.0\.0\.1|10\.0\.2\.2|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3})(:\d+)?$/i.test(origin);
      const ok = pm.response.code === 200 && d.status === "ready" && d.qa === true &&
        d.checks && typeof d.checks === "object" && local && base === origin + "/api/v1";
      pm.test("Gateway returns 200", () => pm.response.to.have.status(200));
      pm.test("Gateway reports ready and qa=true", () => pm.expect(ok).to.eql(true));
      pm.test("Configured target is local and baseUrl matches gatewayOrigin", () => pm.expect(base).to.eql(origin + "/api/v1"));
      pm.collectionVariables.set("qaReadyConfirmed", ok ? "true" : "false");
      if (!ok) {
        console.error("QA preflight failed. Remaining collection requests must be skipped.");
        pm.execution.setNextRequest(null);
      }
    language: text/javascript
order: 1000
