$kind: http-request
url: "{{baseUrl}}/attempts/{{attemptId}}"
method: GET
headers:
  Authorization: Bearer {{accessTokenA}}
  X-Correlation-ID: "{{$guid}}"
scripts:
  - type: beforeRequest
    code: 'if (pm.collectionVariables.get("qaReadyConfirmed") !== "true") { console.warn("Skipped: QA preflight not passed."); pm.execution.skipRequest(); }'
    language: text/javascript
  - type: afterResponse
    code: |-
      const b = bodyJson();
      expectStatus(200);
      const status = String(findValue(b,["status","state"]) || "").toUpperCase();
      pm.test("Attempt has one finalized state", () => pm.expect(["SUBMITTED","COMPLETED","FINALIZED"]).to.include(status));
      pm.collectionVariables.set("api031FinalStatus", status);
    language: text/javascript
order: 3000
